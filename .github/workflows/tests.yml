name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        wp: ['6.7', '6.8', '6.9']
      fail-fast: false

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Checkout WPMediaVerse Pro
        env:
          TOKEN: ${{ secrets.PRO_REPO_TOKEN }}
        run: git clone --depth=1 "https://x-access-token:${TOKEN}@github.com/vapvarun/wpmediaverse-pro.git" "$GITHUB_WORKSPACE/../wpmediaverse-pro"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, intl
          coverage: none

      - name: Install system dependencies
        run: sudo apt-get install -y subversion

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist

      - name: Install WordPress test library
        env:
          WP_VERSION: ${{ matrix.wp }}
        run: bash bin/install-wp-tests.sh wp_tests root root 127.0.0.1 "$WP_VERSION" true

      - name: Run PHPUnit
        run: vendor/bin/phpunit --testdox

  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse -c phpstan.neon.dist --memory-limit=2G

  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: PHP Lint
        run: find includes/ templates/ src/ -name '*.php' -exec php -l {} + && php -l wpmediaverse.php

  wpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist
      - name: Run WPCS (errors block, warnings pass)
        run: |
          set +e
          vendor/bin/phpcs --standard=phpcs.xml --report=summary
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "WPCS: clean"
            exit 0
          fi
          ERRORS=$(vendor/bin/phpcs --standard=phpcs.xml --report=json 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['totals']['errors'])" 2>/dev/null || echo "0")
          echo "WPCS errors: $ERRORS"
          if [ "$ERRORS" -gt 0 ]; then
            vendor/bin/phpcs --standard=phpcs.xml
            exit 1
          fi

  plugin-check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp_pcp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring

      - name: Setup WordPress
        run: |
          mkdir -p /tmp/wp
          curl -sL https://wordpress.org/latest.tar.gz | tar xz -C /tmp/wp --strip-components=1
          cp /tmp/wp/wp-config-sample.php /tmp/wp/wp-config.php
          sed -i "s/database_name_here/wp_pcp/" /tmp/wp/wp-config.php
          sed -i "s/username_here/root/" /tmp/wp/wp-config.php
          sed -i "s/password_here/root/" /tmp/wp/wp-config.php
          sed -i "s/localhost/127.0.0.1/" /tmp/wp/wp-config.php

      - name: Install WP-CLI
        run: |
          curl -O https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar
          sudo mv wp-cli.phar /usr/local/bin/wp

      - name: Install WordPress
        working-directory: /tmp/wp
        run: |
          wp core install --url=http://localhost --title=Test --admin_user=admin --admin_password=admin --admin_email=test@test.com --skip-email

      - name: Install Plugin Check
        working-directory: /tmp/wp
        run: |
          wp plugin install plugin-check --activate
          # If that fails, clone from git
          if [ $? -ne 0 ]; then
            git clone --depth=1 https://github.com/WordPress/plugin-check.git wp-content/plugins/plugin-check
            cd wp-content/plugins/plugin-check && composer install --no-dev
            cd /tmp/wp && wp plugin activate plugin-check
          fi

      - name: Copy plugin (mirror Gruntfile dist excludes — check only what ships to customers)
        run: |
          # IMPORTANT: this exclude list must mirror Gruntfile.js copy:dist task.
          # Plugin Check should only inspect files that customers receive in the dist zip.
          rsync -a \
            --exclude='tests/' --exclude='bin/' --exclude='tools/' --exclude='dist/' \
            --exclude='docs/' --exclude='qa/' --exclude='audit/' --exclude='plan/' --exclude='plans/' --exclude='marketing/' \
            --exclude='node_modules/' --exclude='test-results/' \
            --exclude='.git*' --exclude='.github/' --exclude='.claude/' --exclude='.playwright-mcp/' \
            --exclude='.distignore' --exclude='.editorconfig' --exclude='.eslintrc*' --exclude='.babelrc' --exclude='.browserslistrc' --exclude='.phpunit.result.cache' \
            --exclude='phpunit.xml' --exclude='phpunit.xml.dist' \
            --exclude='phpcs.xml' --exclude='.phpcs.xml.dist' \
            --exclude='phpstan.neon' --exclude='phpstan.neon.dist' --exclude='phpstan-baseline.neon' \
            --exclude='composer.json' --exclude='composer.lock' \
            --exclude='package.json' --exclude='package-lock.json' \
            --exclude='Gruntfile.js' --exclude='webpack.config.js' \
            --exclude='playwright.config.ts' \
            --exclude='CLAUDE.md' --exclude='ARCHITECTURE.md' --exclude='README.md' \
            --exclude='populate-showcase.php' \
            --exclude='*.md' --include='readme.txt' \
            "$GITHUB_WORKSPACE/" /tmp/wp/wp-content/plugins/wpmediaverse/

      - name: Run Plugin Check
        working-directory: /tmp/wp
        run: |
          RESULT=$(wp plugin check wpmediaverse --format=table 2>&1)
          echo "$RESULT"
          # Count real code errors (skip test files, build artifacts, dev files)
          NOISE='compressed_files|hidden_files|application_detected|missing_direct_file_access_protection|outdated_tested_upto_header|trademarks'
          CODE_ERRORS=$(echo "$RESULT" | awk -v noise="$NOISE" '
            /^FILE:/ { file=$2 }
            /\tERROR\t/ {
              if (file ~ /^tests\//) next
              if (file ~ /^bin\//) next
              if (file ~ /^dist\//) next
              for (i=1; i<=NF; i++) if ($i ~ noise) next
              count++
            }
            END { print count+0 }
          ')
          echo "Code errors: $CODE_ERRORS"
          if [ "$CODE_ERRORS" -gt 0 ]; then
            echo "::error::Plugin Check found $CODE_ERRORS code errors"
            exit 1
          fi
