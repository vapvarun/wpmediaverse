name: E2E (Phase 0c)

on:
  push:
    branches: [main, master, '1.2.0']
  pull_request:
    branches: [main, master, '1.2.0']

# Three Playwright specs that catch the URL-signing leak classes static
# analysis cannot reach (runtime URL composition inside the Interactivity
# API, broadcast-TTL emission baked into BP activity HTML, conditional
# render flow for empty-state cover images).
#
# Specs spin up a fresh wp-env each run with both Free and Pro active.
# Failure blocks merge.

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Checkout WPMediaVerse Pro
        env:
          TOKEN: ${{ secrets.PRO_REPO_TOKEN }}
        run: |
          git clone --depth=1 \
            "https://x-access-token:${TOKEN}@github.com/vapvarun/wpmediaverse-pro.git" \
            "$GITHUB_WORKSPACE/../wpmediaverse-pro"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + deps
        run: |
          npm install --no-save '@playwright/test@^1.49.0' '@types/node@^20.0.0'
          npx playwright install --with-deps chromium

      - name: Install wp-env globally
        run: npm install -g '@wordpress/env@^10.0.0'

      - name: Configure wp-env
        run: |
          cat > .wp-env.json <<'EOF'
          {
            "core": "WordPress/WordPress#6.8",
            "phpVersion": "8.2",
            "plugins": [
              ".",
              "../wpmediaverse-pro",
              "https://downloads.wordpress.org/plugin/buddypress.zip"
            ],
            "env": {
              "tests": {
                "config": {
                  "WP_DEBUG": true,
                  "WP_DEBUG_LOG": true
                }
              }
            }
          }
          EOF

      - name: Boot wp-env (Free + Pro + BuddyPress)
        run: |
          wp-env start
          wp-env run cli wp plugin activate buddypress
          wp-env run cli wp user create autotest autotest@example.com --role=administrator --user_pass=autotest

      - name: Run Phase 0c E2E specs
        env:
          MVS_SITE_URL: http://localhost:8888
          CI: 'true'
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
