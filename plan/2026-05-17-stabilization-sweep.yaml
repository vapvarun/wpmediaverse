# 1.3.0 Stabilization Sweep — what's still open
#
# Big-picture: 1.3.0 is feature-complete. Versions are bumped (Free + Pro
# both at 1.3.0), changelogs are in place, branches pushed. The items below
# are the ONLY things still pending.
#
# What shipped — read `git log` on both repos. Don't re-document here.

meta:
  date: 2026-05-17
  release: 1.3.0
  free_branch: 1.2.2   # patch branch carried 1.3.0 work; rename at tag time if desired
  pro_branch: 1.2.2

open:

  - id: M3-REVISIT
    name: "MVS_CSS consolidation"
    why: |
      bin/cleanup-duplicate-detect.php flagged a 1288-token cross-plugin
      duplicate at includes/Blocks/MVS_CSS.php. The earlier decline
      doc (now deleted) used wrong reasoning — Pro requires Free per
      its plugin header + bootstrap check, so Pro can call
      \WPMediaVerse\Blocks\MVS_CSS directly.
    scope:
      - "Delete wpmediaverse-pro/includes/Blocks/MVS_CSS.php (276 lines)"
      - "Update Pro block render.php files (~10-15 files in build/blocks/*/) to call \\WPMediaVerse\\Blocks\\MVS_CSS::add() instead of \\WPMediaVersePro\\Blocks\\MVS_CSS::add()"
      - "Smoke: compete page + any block-heavy Pro page renders, single <style id='mvs-block-styles'> on wp_footer carries both Free + Pro block CSS"
    estimate: "~30 min including verification"
    risk: low
    blocker: "Waiting on user go/no-go"

  - id: F5-FINISH
    name: "Manifest detail sections — REST/hooks/admin_pages enumeration"
    why: |
      audit/manifests/manifest.summary.json#/baseline_drift records the
      gap. wp_cli enumeration was completed earlier (16 entries). The
      remaining three categories still drift behind ground-truth grep
      counts.
    scope:
      - "REST endpoints: 53 manifested vs 85 register_rest_route call sites (32 missing)"
      - "hooks_fired: 24 manifested vs 124 unique callsites (~100 missing)"
      - "admin_pages: 7 manifested vs 20 add_*_page call sites (13 sub-pages missing)"
      - "register_setting: 35 in detail vs 40 callsites (5 missing)"
    estimate: "~3 hours focused parallel-agent session"
    customer_impact: "none — descriptive accuracy only"
    risk: zero
    blocker: "none — can run any time"

  - id: TIER-D
    name: "Complex aggregations needing MediaRepository::query() builder"
    why: |
      Free + Pro have several places that build dynamic SQL with
      conditional joins / NOT IN subqueries (search/tag/cat/profile
      filters, gallery_exclude). They don't fit cleanly behind the
      simple repository methods we have. A small query-builder design
      unblocks all of them at once.
    scope:
      - "Free templates/explore.php:340-368 (explore listing aggregation)"
      - "Pro templates/layouts/{dribbble,flickr,pinterest}/feed-body.php"
      - "Pro templates/instagram-feed.php (top-level)"
      - "Pro templates/layouts/{dribbble,flickr}/profile.php (gallery_exclude NOT IN subqueries)"
      - "Pro Integrations/{RtMedia,MediaPress,BuddyBoss}/MigrationAdmin.php (admin-only, lowest priority)"
    estimate: "design query builder = ~2 hours; refactor consumers = ~4 hours"
    risk: medium
    blocker: "Tier D won't move until the query-builder design is reviewed"

  - id: BOUNDARY-CHECK-TIGHTEN
    name: "bin/cleanup-boundary-check.sh — distinguish Free vs Pro tables"
    why: |
      Current rule 'direct_wpdb_on_mvs_table' matches any mvs_* prefix
      indiscriminately. This session caught ~12 false positives where
      Pro services legitimately query Pro-owned tables
      (mvs_competition_entries, mvs_play_events, mvs_pro_*).
    scope:
      - "Hard-code FREE_TABLES list in the script (mvs_media_index, mvs_media_meta, mvs_favorites, mvs_album_items, mvs_notifications, mvs_follows, mvs_reports, mvs_access_rules, mvs_reactions, mvs_mentions, mvs_activity, mvs_blocks, mvs_messages, mvs_conversations, mvs_conversation_participants, mvs_message_reactions, mvs_media_views, mvs_media_stats, mvs_transactions, mvs_access_grants, mvs_error_log)"
      - "Skip any wpdb query whose table token is not in FREE_TABLES"
    estimate: "~30 min"
    risk: zero
    customer_impact: "none"

operator_actions:
  - "Tag + GitHub release 1.3.0 on both repos when ready"
  - "Decide M3-REVISIT (execute now vs 1.3.1 vs defer)"

production_rules_status:
  note: |
    The 9 Production Rules block in CLAUDE.md was written assuming 50+
    live customer sites. User clarified in today's session that most
    sites are still experimenting. The rules stay as preventive
    scaffolding for when the fleet matures; for now we ship clean
    refactors without feature-flag soak.
